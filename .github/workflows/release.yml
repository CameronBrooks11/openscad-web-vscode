name: Release

# Build and attach the packaged .vsix to a published GitHub Release.
# Distribution is Release-only for now — no Marketplace / Open VSX account is
# involved, so nothing is tied to a maintainer identity. The full gate + the
# tag<->version guard must pass first, so a broken or mistagged release can't ship.
#
# To publish to a registry later (e.g. after this project moves to the OpenSCAD
# org, under the org's identity), add a step after "Package VSIX":
#   - name: Publish to VS Code Marketplace
#     env: { VSCE_PAT: ${{ secrets.VSCE_PAT }} }
#     run: npx @vscode/vsce publish --no-dependencies --packagePath openscad-web-vscode.vsix
#   - name: Publish to Open VSX
#     env: { OVSX_PAT: ${{ secrets.OVSX_PAT }} }
#     run: npx ovsx publish openscad-web-vscode.vsix -p "$OVSX_PAT"
# See CONTRIBUTING.md.

on:
  release:
    types: [published]

permissions:
  contents: write # upload the VSIX asset to the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check
        run: npm run check

      - name: Extension smoke test (headless)
        run: xvfb-run -a npm test

      - name: Verify Release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version 'v$PKG_VERSION'"
            exit 1
          fi
          echo "Building v$PKG_VERSION"

      - name: Package VSIX
        run: npm run package # -> openscad-web-vscode.vsix

      - name: Attach VSIX to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" openscad-web-vscode.vsix --clobber
